# docker-compose utilisé pour tester le failover en local
services:
  failover:
    build: .
    ports:
      - "18082:80"
    environment:
      UPSTREAM_HOST: web
      UPSTREAM_PORT: "80"
      HEALTH_INTERVAL: "2"
      HEALTH_FAIL_THRESHOLD: "2"
      HEALTH_PASS_THRESHOLD: "2"
      TITLE: "Self | Service indisponible"
      HEADLINE: "Self est indisponible"
      MESSAGE: "Une maintenance est en cours, nous faisons au plus vite."
      TEAM_NAME: ""

  web:
    image: hashicorp/http-echo:1.0
    command: ["-text=I AM WEB", "-listen=:80"]
