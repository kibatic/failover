variables:
  DOCKER_IMAGE_NAME: $CI_PROJECT_PATH
  BRANCH_TO_PUSH_REGISTERY: master

stages:
  - build

before_script:
  - id
  - docker info
  - export DOCKER_IMAGE_TAG=latest
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

build:
  stage: build
  script:
    - echo $REGISTRY_HOST/$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG
    - docker build --pull --tag $REGISTRY_HOST/$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG .
    - docker push $REGISTRY_HOST/$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG
  only:
    - master
